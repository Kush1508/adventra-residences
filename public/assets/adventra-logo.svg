<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">AdVentra circular logo</title>
  <desc id="desc">White AdVentra lettering and a four-piece puzzle emblem on a deep blue square.</desc>
  <defs>
    <path id="topArc" d="M 125,400 A 275,275 0 0 1 675,400" />
    <path id="bottomArc" d="M 675,400 A 275,275 0 0 1 125,400" />
  </defs>
  <rect width="800" height="800" fill="#1d4782"/>
  <g id="rotating-text" transform="rotate(0 400 400)" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" letter-spacing="9">
    <text text-anchor="middle"><textPath href="#topArc" startOffset="50%">ADVENTRA</textPath></text>
    <text text-anchor="middle"><textPath href="#bottomArc" startOffset="50%">ADVENTRA</textPath></text>
  </g>
  <image x="300" y="300" width="200" height="200" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>
</svg>

